<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>IST Admissions — AI Calling Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #1a73e8;
      --primary-dark: #1557b0;
      --primary-light: #e8f0fe;
      --accent: #4285f4;
      --bg: #f0f4f9;
      --card: #ffffff;
      --text: #1a1a2e;
      --text-muted: #5f6368;
      --danger: #ea4335;
      --success: #34a853;
      --border: #dadce0;
      --shadow: 0 2px 16px rgba(26, 115, 232, 0.10);
      --shadow-lg: 0 8px 32px rgba(26, 115, 232, 0.15);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: white;
      padding: 1.25rem 1.5rem;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.3px; }
    header p { font-size: 0.82rem; opacity: 0.88; margin-top: 0.3rem; font-weight: 400; }

    .container {
      width: 100%;
      max-width: 460px;
      padding: 1.5rem 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 2rem 1.5rem;
      width: 100%;
      text-align: center;
      transition: box-shadow 0.3s;
    }
    .card:hover { box-shadow: var(--shadow-lg); }

    .avatar {
      width: 80px; height: 80px;
      background: var(--primary-light);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.25rem;
      position: relative;
    }
    .avatar svg { width: 40px; height: 40px; color: var(--primary); }
    .avatar .pulse {
      position: absolute; inset: -6px;
      border-radius: 50%;
      border: 3px solid var(--primary);
      opacity: 0;
      animation: none;
    }
    .avatar .pulse.active {
      animation: pulse-ring 1.8s ease-out infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.25); opacity: 0; }
    }

    .status {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      min-height: 1.4em;
      line-height: 1.4;
    }
    .status.active { color: var(--success); font-weight: 500; }
    .status.listening { color: var(--danger); font-weight: 500; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem 2.2rem;
      border: none;
      border-radius: 50px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: white;
      box-shadow: 0 4px 14px rgba(26, 115, 232, 0.35);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(26, 115, 232, 0.45);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
      box-shadow: 0 4px 14px rgba(234, 67, 53, 0.3);
    }
    .btn-danger:hover:not(:disabled) {
      background: #d32f2f;
      transform: translateY(-1px);
    }

    .transcript {
      margin-top: 1.25rem;
      max-height: 260px;
      overflow-y: auto;
      text-align: left;
      width: 100%;
    }
    .transcript::-webkit-scrollbar { width: 4px; }
    .transcript::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .turn {
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--primary-light);
      animation: fadeIn 0.3s ease;
    }
    .turn:last-child { border-bottom: none; }
    .turn-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.2rem;
    }
    .turn-label.user { color: var(--primary); }
    .turn-label.agent { color: var(--success); }
    .turn-text { font-size: 0.85rem; color: var(--text); line-height: 1.45; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .metrics-card {
      background: var(--primary-light);
      border-radius: 14px;
      padding: 1.25rem;
      margin-top: 1rem;
      width: 100%;
    }
    .metrics-card h3 {
      font-size: 0.85rem;
      color: var(--primary);
      margin-bottom: 0.75rem;
      font-weight: 600;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }
    .metric {
      background: white;
      border-radius: 10px;
      padding: 0.6rem;
      text-align: center;
    }
    .metric-value { font-size: 1.2rem; font-weight: 700; color: var(--primary); }
    .metric-label { font-size: 0.68rem; color: var(--text-muted); margin-top: 0.15rem; }

    .waveform {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 30px;
      margin: 0.75rem 0;
    }
    .waveform .bar {
      width: 3px;
      background: var(--primary);
      border-radius: 2px;
      animation: none;
      height: 8px;
      transition: height 0.1s;
    }
    .waveform.active .bar { animation: wave 0.8s ease-in-out infinite; }
    .waveform.active .bar:nth-child(1) { animation-delay: 0s; }
    .waveform.active .bar:nth-child(2) { animation-delay: 0.1s; }
    .waveform.active .bar:nth-child(3) { animation-delay: 0.2s; }
    .waveform.active .bar:nth-child(4) { animation-delay: 0.3s; }
    .waveform.active .bar:nth-child(5) { animation-delay: 0.4s; }
    .waveform.active .bar:nth-child(6) { animation-delay: 0.3s; }
    .waveform.active .bar:nth-child(7) { animation-delay: 0.2s; }

    @keyframes wave {
      0%, 100% { height: 8px; }
      50% { height: 26px; }
    }

    .hidden { display: none !important; }

    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    @media (min-width: 640px) {
      .container { padding: 2rem; }
      .card { padding: 2.5rem 2rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Institute of Space Technology</h1>
    <p>AI Admissions Assistant</p>
  </header>

  <div class="container">
    <div class="card">
      <div class="avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
        <div class="pulse" id="pulseRing"></div>
      </div>

      <div class="waveform" id="waveform">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div>
      </div>

      <div class="status" id="status">Tap the button below to start your call. When the browser asks for microphone access, click Allow.</div>

      <button class="btn btn-primary" id="startBtn" onclick="startCall()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        Start AI Call
      </button>

      <button class="btn btn-danger hidden" id="endBtn" onclick="endCall()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.956.956 0 0 1-.29-.7c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.1-.7-.28-.79-.74-1.69-1.36-2.67-1.85a1 1 0 0 1-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
        </svg>
        End Call
      </button>

      <div class="transcript" id="transcript"></div>

      <div class="metrics-card hidden" id="metricsCard">
        <h3>Call Summary</h3>
        <div class="metrics-grid">
          <div class="metric">
            <div class="metric-value" id="metricDuration">—</div>
            <div class="metric-label">Duration (s)</div>
          </div>
          <div class="metric">
            <div class="metric-value" id="metricTurns">—</div>
            <div class="metric-label">Questions</div>
          </div>
          <div class="metric">
            <div class="metric-value" id="metricEscalated">—</div>
            <div class="metric-label">Escalated</div>
          </div>
          <div class="metric">
            <div class="metric-value" id="metricLatency">—</div>
            <div class="metric-label">Avg Latency (ms)</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>Institute of Space Technology, Islamabad</footer>

  <script>
    const API = window.location.origin;
    let sessionId = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let currentAudio = null;
    let isRecording = false;
    let callActive = false;
    let silenceTimer = null;
    let latencies = [];

    const startBtn = document.getElementById('startBtn');
    const endBtn = document.getElementById('endBtn');
    const status = document.getElementById('status');
    const transcript = document.getElementById('transcript');
    const waveform = document.getElementById('waveform');
    const pulseRing = document.getElementById('pulseRing');
    const metricsCard = document.getElementById('metricsCard');

    function setStatus(text, cls = '') {
      status.textContent = text;
      status.className = 'status ' + cls;
    }

    function addTurn(role, text) {
      const div = document.createElement('div');
      div.className = 'turn';
      div.innerHTML = `
        <div class="turn-label ${role}">${role === 'user' ? 'You' : 'IST Agent'}</div>
        <div class="turn-text">${text}</div>
      `;
      transcript.appendChild(div);
      transcript.scrollTop = transcript.scrollHeight;
    }

    async function startCall() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus('Your browser does not support microphone access. Try Chrome or Edge.');
        return;
      }

      try {
        startBtn.disabled = true;
        setStatus('Requesting microphone...');

        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (micErr) {
          console.error('Mic error:', micErr.name, micErr.message);
          var msg = 'Microphone blocked. ';
          if (micErr.name === 'NotAllowedError' || micErr.name === 'PermissionDeniedError') {
            msg += 'Click the lock or info icon next to the URL → set Microphone to Allow → reload this page, then click Start again.';
          } else if (micErr.name === 'NotFoundError') {
            msg += 'No microphone found. Connect a mic and try again.';
          } else {
            msg += 'Please allow mic in browser settings, reload, and try again.';
          }
          setStatus(msg);
          startBtn.disabled = false;
          return;
        }
        window._micStream = stream;

        setStatus('Connecting...');

        const resp = await fetch(`${API}/api/start`, { method: 'POST' });
        if (!resp.ok) {
          var errMsg = resp.status === 502 || resp.status === 503
            ? 'Server is starting. Wait 30–60 seconds and try again.'
            : 'Server error. Try again in a moment.';
          setStatus(errMsg);
          stream.getTracks().forEach(function(t) { t.stop(); });
          startBtn.disabled = false;
          return;
        }
        const data = await resp.json();
        if (data.error) {
          setStatus('Error: ' + (data.error || 'Try again.'));
          stream.getTracks().forEach(function(t) { t.stop(); });
          startBtn.disabled = false;
          return;
        }

        sessionId = data.session_id;

        startBtn.classList.add('hidden');
        endBtn.classList.remove('hidden');
        callActive = true;
        pulseRing.classList.add('active');

        setStatus('Agent is speaking...', 'active');
        await playAudio(data.audio_url);

        startRecording(stream);
      } catch (err) {
        console.error('Start call error:', err);
        if (window._micStream) {
          window._micStream.getTracks().forEach(function(t) { t.stop(); });
          window._micStream = null;
        }
        setStatus('Could not start call. Check your connection and try again.');
        startBtn.disabled = false;
      }
    }

    function playAudio(url) {
      return new Promise((resolve) => {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio = null;
        }
        currentAudio = new Audio(API + url);
        waveform.classList.add('active');

        setupBargeIn();

        currentAudio.onended = () => {
          waveform.classList.remove('active');
          currentAudio = null;
          stopBargeIn();
          resolve();
          if (callActive) startRecording(window._micStream);
        };
        currentAudio.onerror = () => {
          waveform.classList.remove('active');
          currentAudio = null;
          stopBargeIn();
          resolve();
          if (callActive) startRecording(window._micStream);
        };
        currentAudio.play().catch(() => resolve());
      });
    }

    /* ---- Barge-in: stop TTS only on clear speech ---- */
    let bargeInCtx = null;
    let bargeInAnalyser = null;
    let bargeInInterval = null;
    let bargeInAboveCount = 0;
    const BARGE_IN_THRESHOLD = 0.06;
    const BARGE_IN_MIN_FRAMES = 5; // ~250ms of speech at 50ms intervals

    function setupBargeIn() {
      if (!window._micStream) return;
      try {
        bargeInCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = bargeInCtx.createMediaStreamSource(window._micStream);
        bargeInAnalyser = bargeInCtx.createAnalyser();
        bargeInAnalyser.fftSize = 512;
        source.connect(bargeInAnalyser);
        bargeInAboveCount = 0;

        const dataArray = new Float32Array(bargeInAnalyser.fftSize);
        bargeInInterval = setInterval(() => {
          if (!currentAudio) { stopBargeIn(); return; }
          bargeInAnalyser.getFloatTimeDomainData(dataArray);
          let rms = 0;
          for (let i = 0; i < dataArray.length; i++) rms += dataArray[i] * dataArray[i];
          rms = Math.sqrt(rms / dataArray.length);

          if (rms > BARGE_IN_THRESHOLD) {
            bargeInAboveCount++;
          } else {
            bargeInAboveCount = Math.max(0, bargeInAboveCount - 1);
          }

          if (bargeInAboveCount >= BARGE_IN_MIN_FRAMES && currentAudio) {
            currentAudio.pause();
            currentAudio = null;
            waveform.classList.remove('active');
            stopBargeIn();
            if (callActive && !isRecording) startRecording(window._micStream);
          }
        }, 50);
      } catch (e) {
        console.warn('Barge-in setup failed:', e);
      }
    }

    function stopBargeIn() {
      if (bargeInInterval) { clearInterval(bargeInInterval); bargeInInterval = null; }
      if (bargeInCtx) { bargeInCtx.close().catch(() => {}); bargeInCtx = null; }
      bargeInAboveCount = 0;
    }

    /* ---- Recording with silence detection ---- */
    function startRecording(stream) {
      if (!callActive || isRecording) return;
      isRecording = true;
      audioChunks = [];
      setStatus('Listening... speak now', 'listening');

      const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus'
        : 'audio/webm';

      mediaRecorder = new MediaRecorder(stream, { mimeType });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        isRecording = false;
        if (!callActive) return;
        if (audioChunks.length === 0) {
          if (callActive) startRecording(stream);
          return;
        }
        const blob = new Blob(audioChunks, { type: mimeType });
        audioChunks = [];
        await sendAudio(blob);
      };

      mediaRecorder.start(250);

      // Silence detection via AudioContext
      const silCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = silCtx.createMediaStreamSource(stream);
      const analyser = silCtx.createAnalyser();
      analyser.fftSize = 512;
      src.connect(analyser);

      let silentFrames = 0;
      let hasSpoken = false;
      const dataArr = new Float32Array(analyser.fftSize);
      const SPEAK_THRESHOLD = 0.025;
      const SILENCE_FRAMES_NEEDED = 25; // ~1.25s silence after speech

      const silCheck = setInterval(() => {
        if (!isRecording) {
          clearInterval(silCheck);
          silCtx.close().catch(() => {});
          return;
        }
        analyser.getFloatTimeDomainData(dataArr);
        let rms = 0;
        for (let i = 0; i < dataArr.length; i++) rms += dataArr[i] * dataArr[i];
        rms = Math.sqrt(rms / dataArr.length);

        if (rms > SPEAK_THRESHOLD) {
          hasSpoken = true;
          silentFrames = 0;
        } else if (hasSpoken) {
          silentFrames++;
        }

        if (hasSpoken && silentFrames >= SILENCE_FRAMES_NEEDED) {
          clearInterval(silCheck);
          silCtx.close().catch(() => {});
          if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
          }
        }
      }, 50);

      // Fallback: max 12 seconds recording
      silenceTimer = setTimeout(() => {
        clearInterval(silCheck);
        silCtx.close().catch(() => {});
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
        }
      }, 12000);
    }

    async function sendAudio(blob) {
      setStatus('Processing your question...', 'active');

      const form = new FormData();
      form.append('session_id', sessionId);
      form.append('audio', blob, 'recording.webm');

      try {
        const resp = await fetch(`${API}/api/query`, { method: 'POST', body: form });
        const data = await resp.json();

        if (data.error && data.retry) {
          setStatus('Could not hear you clearly. Please try again.', 'listening');
          if (callActive) startRecording(window._micStream);
          return;
        }
        if (data.error) {
          setStatus('Error: ' + data.error);
          return;
        }

        if (data.user_text) addTurn('user', data.user_text);
        addTurn('agent', data.text);

        if (data.latency_ms) latencies.push(data.latency_ms);

        if (data.end_call) {
          setStatus('Call ended', '');
          callActive = false;
          pulseRing.classList.remove('active');
          endBtn.classList.add('hidden');
          startBtn.classList.remove('hidden');
          startBtn.disabled = false;
          showMetrics(data.metrics);
          await playAudio(data.audio_url);
          return;
        }

        setStatus('Agent is speaking...', 'active');
        await playAudio(data.audio_url);
      } catch (err) {
        console.error('Query error:', err);
        setStatus('Connection error. Please try again.');
        if (callActive) startRecording(window._micStream);
      }
    }

    function endCall() {
      callActive = false;
      pulseRing.classList.remove('active');
      waveform.classList.remove('active');

      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      stopBargeIn();

      if (window._micStream) {
        window._micStream.getTracks().forEach(t => t.stop());
      }

      endBtn.classList.add('hidden');
      startBtn.classList.remove('hidden');
      startBtn.disabled = false;
      setStatus('Call ended');
    }

    function showMetrics(metrics) {
      if (!metrics) return;
      metricsCard.classList.remove('hidden');
      document.getElementById('metricDuration').textContent = metrics.call_duration_seconds || '—';
      document.getElementById('metricTurns').textContent = metrics.total_turns || '—';
      document.getElementById('metricEscalated').textContent = metrics.escalated ? 'Yes' : 'No';
      const avgLat = latencies.length > 0
        ? Math.round(latencies.reduce((a,b) => a+b, 0) / latencies.length)
        : '—';
      document.getElementById('metricLatency').textContent = avgLat;
    }
  </script>
</body>
</html>
